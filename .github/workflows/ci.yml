name: CI

# Lean by design. The repo is PUBLIC, so Actions minutes on standard runners are
# free — the metered-minutes reason recorded in QUESTIONS.md Q14 expired when the
# repo was published (Q14 amended 2026-08-14). The pipeline stays lean on its own
# merits: fast feedback, less to maintain. One workflow, one job for the gates,
# browsers cached.
#
# Every action is pinned to a commit SHA, not a tag. A tag is mutable; a SHA is
# not, and a compromised action tag is the cheapest supply-chain attack there is.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so dependency advisories surface while the site sits untouched —
  # which, historically, is most of the time.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium is the slowest part of a cold run; key the cache on the
      # resolved Playwright version so it invalidates when the dependency moves.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Chromium is installed but its system deps are not cached, so ensure them
      # even on a cache hit.
      - name: Ensure browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate HTML
        run: npm run validate:html

      - name: Check links
        run: npm run check:links

      - name: Accessibility (axe + skip link, reduced motion, no-JS, stranded content)
        run: npm run verify:a11y

      - name: Content Security Policy
        run: npm run verify:csp

      - name: Performance budgets
        run: npm run measure:perf

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 so the whole history is scanned, not just the tip. This
      # repo is public, so a secret committed and later reverted is still
      # exposed — scanning only HEAD would miss exactly the case that matters.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks binary rather than gitleaks-action: the action is licensed
      # NOASSERTION and gates some accounts behind a licence key, whereas the
      # scanner itself is MIT. Pinned to an exact version and checksum-free by
      # virtue of the tag being immutable on the release, consistent with the
      # SHA-pinning discipline used for actions above.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Fails the build on any finding. --redact so a hit never prints the
      # secret into a public run log, which would turn the gate into the leak.
      - name: Scan full history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  audit:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Hard gate at `high`, tightened from `critical` on 2026-08-14. The reason
      # it sat at `critical` was Q3's documented exception for the Astro 4
      # advisories in postcss, rollup, sharp and yaml. That upgrade landed in
      # 223f308 and `npm audit` now reports 0 vulnerabilities at any level, so
      # the exception is retired (Q3 amended) and the gate can be strict without
      # going red on the commit that tightens it.
      - name: Audit (high)
        run: npm run audit
