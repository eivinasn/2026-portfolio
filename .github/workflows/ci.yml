name: CI

# Lean by design — this is a private repo, so Actions minutes are metered
# (QUESTIONS.md Q14). One workflow, one job for the gates, browsers cached.
#
# Every action is pinned to a commit SHA, not a tag. A tag is mutable; a SHA is
# not, and a compromised action tag is the cheapest supply-chain attack there is.

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so dependency advisories surface while the site sits untouched —
  # which, historically, is most of the time.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium is the slowest part of a cold run; key the cache on the
      # resolved Playwright version so it invalidates when the dependency moves.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Chromium is installed but its system deps are not cached, so ensure them
      # even on a cache hit.
      - name: Ensure browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate HTML
        run: npm run validate:html

      - name: Check links
        run: npm run check:links

      - name: Accessibility (axe + skip link, reduced motion, no-JS, stranded content)
        run: npm run verify:a11y

      - name: Content Security Policy
        run: npm run verify:csp

      - name: Performance budgets
        run: npm run measure:perf

  audit:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Hard gate. Anything critical fails the build.
      - name: Audit (critical)
        run: npm run audit

      # Not a gate, but never silent. Q3 accepts the current high-severity
      # findings because every one of them is build-time only for a static site
      # — postcss, rollup, sharp and yaml run on the build machine and ship
      # nothing to the browser. The remediation npm proposes is a three-major
      # Astro upgrade, deferred past increment 10.
      #
      # This step surfaces them on every run so the exception stays visible and
      # gets re-examined rather than forgotten. Revisit Q3 if this list grows or
      # if anything here reaches the browser.
      - name: Report high-severity advisories (accepted — see QUESTIONS.md Q3)
        if: always()
        run: |
          echo "### Dependency advisories" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high || true
          npm audit --audit-level=high >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Accepted per QUESTIONS.md Q3: build-time only for a static site." >> "$GITHUB_STEP_SUMMARY"
