name: Deploy

# DORMANT UNTIL ARMED.
#
# Every job below is gated on the repository variable DEPLOY_ENABLED == 'true'.
# Until the founder sets it, this workflow runs, skips everything, and reports
# success. Nothing reaches eivinasn.com by accident.
#
# Arming it — all founder actions, none of which Claude can or should do:
#
#   Repository → Settings → Secrets and variables → Actions
#
#   Variables:
#     DEPLOY_ENABLED       true
#     DEPLOY_DELETE        (optional) true to remove remote files that no longer
#                          exist in the build. Off by default — the server holds
#                          files this repo has never seen, and search-console
#                          verification files must survive.
#     DEPLOY_HTACCESS_OVERWRITE
#                          (optional) true to replace a server-side .htaccess
#                          this pipeline did not create. Leave unset. See Q9.
#
#   Secrets:
#     SSH_HOST             Hostinger SSH host
#     SSH_USER             Hostinger SSH username
#     SSH_PORT             Hostinger SSH port (usually 65002)
#     SSH_PRIVATE_KEY      private key, full PEM including header and footer
#     SSH_KNOWN_HOSTS      output of: ssh-keyscan -p <port> <host>
#     DEPLOY_PATH          absolute remote path, e.g.
#                          /home/uXXXXXXXX/domains/eivinasn.com/public_html
#
# Claude never handles these values. They are entered by the founder in GitHub's
# UI and are never read, echoed or committed.
#
# Deliberately manual. Hostinger bans the runner's IP after roughly a dozen SSH
# connections in a day, so this does NOT deploy on every push.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the file list without transferring anything'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, gate, mirror, verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check the pipeline is armed
        id: armed
        run: |
          if [ "${{ vars.DEPLOY_ENABLED }}" != "true" ]; then
            echo "DEPLOY_ENABLED is not 'true' — the deploy pipeline is dormant."
            echo "See the header of .github/workflows/deploy.yml to arm it."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.armed.outputs.armed == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.armed.outputs.armed == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.armed.outputs.armed == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.armed.outputs.armed == 'true'
        run: npx playwright install --with-deps chromium

      # Never deploy something that has not passed every gate.
      - name: Run all gates
        if: steps.armed.outputs.armed == 'true'
        run: npm run verify

      - name: Configure SSH
        if: steps.armed.outputs.armed == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::error::SSH_KNOWN_HOSTS is not set. Refusing to trust the host on first use."
            echo "Generate it with: ssh-keyscan -p <port> <host>"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      # Q9: something configures the live server that is not in this repo — the
      # 301s and an injected CSP header come from somewhere, and HTTP cannot tell
      # us whether an .htaccess is already there. Refuse to find out destructively.
      - name: Protect an unknown server-side .htaccess
        id: htaccess
        if: steps.armed.outputs.armed == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o BatchMode=yes ${SSH_USER}@${SSH_HOST}"
          if $SSH "test -f '${DEPLOY_PATH}/.htaccess'"; then
            if $SSH "grep -q 'GENERATED FILE' '${DEPLOY_PATH}/.htaccess'"; then
              echo "Remote .htaccess was generated by this pipeline — safe to replace."
              echo "send=true" >> "$GITHUB_OUTPUT"
            elif [ "${{ vars.DEPLOY_HTACCESS_OVERWRITE }}" = "true" ]; then
              echo "::warning::Replacing a server-side .htaccess this pipeline did not create, because DEPLOY_HTACCESS_OVERWRITE is set."
              $SSH "cp '${DEPLOY_PATH}/.htaccess' '${DEPLOY_PATH}/.htaccess.bak-$(date +%Y%m%d%H%M%S)'"
              echo "send=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::A server-side .htaccess exists that this pipeline did not create."
              echo "Deploying ours would silently replace working configuration — see QUESTIONS.md Q9."
              echo "Inspect it, fold anything it does into config/htaccess.template, then set"
              echo "DEPLOY_HTACCESS_OVERWRITE=true for one run. A timestamped backup is taken."
              exit 1
            fi
          else
            echo "No remote .htaccess. Ours will be created."
            echo "send=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror dist/ to Hostinger
        if: steps.armed.outputs.armed == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          FLAGS="-rlvz --checksum --human-readable"
          # Off by default: the server holds files this repo has never seen, and
          # search-console verification files must survive a deploy.
          if [ "${{ vars.DEPLOY_DELETE }}" = "true" ]; then
            FLAGS="$FLAGS --delete --exclude=.htaccess.bak-* --exclude=.well-known/"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
            echo "::notice::DRY RUN — no files will be transferred."
          fi
          if [ "${{ steps.htaccess.outputs.send }}" != "true" ]; then
            FLAGS="$FLAGS --exclude=.htaccess"
          fi
          rsync $FLAGS \
            -e "ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o BatchMode=yes" \
            dist/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Smoke test the live site
        if: steps.armed.outputs.armed == 'true' && inputs.dry_run != true
        run: npm run smoke

      - name: Clean up credentials
        if: always()
        run: rm -f ~/.ssh/id_deploy
